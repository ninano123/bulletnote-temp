<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>래피드 로그 · 하루 불릿저널</title>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="../assets/sheet.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="../assets/sheet.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const { h } = Bujo;

const dot = `
<div class="pg">
  <div class="head"><div class="bar">DAILY LOG</div>${h.dateLine()}</div>
  <div class="box dots" style="flex:1"></div>
  ${h.keyLine()}
</div>`;

const margin = `
<div class="pg">
  <div class="cols" style="grid-template-columns:45fr 55fr;align-items:start">
    <div class="bar">RAPID LOG</div>
    ${h.dateBox()}
  </div>
  <div class="box gut" style="flex:1">${h.lines(30)}<span class="gut-line"></span></div>
  ${h.keyLine()}
</div>`;

const split = `
<div class="pg">
  <div class="head"><div class="bar">RAPID LOG · SPLIT</div>${h.dateLine()}</div>
  <div class="cols" style="grid-template-columns:55fr 45fr;flex:1">
    <div class="fx">
      <div class="ttl">TASKS <small>• 할 일</small></div>
      <div class="box" style="flex:1">${h.markLines(24, "•")}</div>
    </div>
    <div class="fx">
      <div class="ttl">EVENTS <small>○ 일정 · 약속</small></div>
      <div class="box" style="flex:8">${h.markLines(8, "○")}</div>
      <div class="ttl mt">NOTES <small>– 메모 · 생각</small></div>
      <div class="box dots" style="flex:13"></div>
    </div>
  </div>
  ${h.keyLine()}
</div>`;

Bujo.mount({
  section: "daily",
  id: "daily-rapid-log",
  name: "래피드 로그",
  en: "Rapid Log",
  summary: "불릿 기호로 할 일, 이벤트, 메모를 짧게 적는 기본 불릿저널 페이지입니다. 정해진 칸 없이 하루 동안 생기는 일을 순서대로 기록합니다.",
  parts: [
    "날짜 · 요일 칸",
    "기록 영역 (도트 그리드, 여백선 줄지, 또는 3분할)",
    "페이지 하단 불릿 기호 범례"
  ],
  usage: [
    "날짜를 적고, 생각나는 대로 한 줄씩 기록합니다.",
    "줄마다 앞에 기호를 붙입니다. • 할 일, ○ 이벤트, – 메모.",
    "끝낸 할 일은 • 위에 ×를 덧그립니다.",
    "하루를 마치며 남은 •는 > (다음 날로 이월) 또는 < (먼슬리 · 퓨처 로그로 이동)로 바꿉니다."
  ],
  tips: [
    "문장은 짧게 쓰세요. 빠르게 적는 것이 래피드 로그의 핵심입니다.",
    "중요한 줄 앞에는 *, 아이디어 앞에는 !를 붙여 다시 찾기 쉽게 하세요.",
    "기록이 많지 않은 날에는 하프 데일리 양식이 더 잘 맞습니다."
  ],
  variants: [
    { key: "dot",    name: "도트 그리드", desc: "가장 기본적인 불릿저널 형태. 자유롭게 쓰고 그릴 수 있는 점 격자.", html: dot },
    { key: "margin", name: "여백선 줄지", desc: "왼쪽 여백선 안쪽에 기호를 쓰고 오른쪽에 내용을 적는 줄지.", html: margin },
    { key: "split",  name: "3분할",       desc: "할 일 · 이벤트 · 메모를 처음부터 나눠 적는 구조.", html: split }
  ]
});
</script>
</body>
</html>
