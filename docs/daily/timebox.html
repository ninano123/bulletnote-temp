<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타임박스 플래너 · 하루 불릿저널</title>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="../assets/sheet.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="../assets/sheet.js"></script>
<style>
  /* 02 포커스 — Top 3 칸 */
  .top3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2cqw; }
  .top3 > div { height: 8.5cqw; display: flex; border: var(--hair) solid var(--s-frame); }
  .top3 b { font-size: 3cqw; font-weight: 700; line-height: 1; color: var(--s-line); padding: .8cqw 1.4cqw; }

  /* 03 계획 · 실행 표 */
  .pd { display: grid; grid-template-columns: 6.5cqw 1fr 1fr 6cqw; }
  .pd-head { font-size: 1.3cqw; font-weight: 600; letter-spacing: .04em; margin-bottom: 1cqw; }
  .pd-head span { padding-left: 1.4cqw; }
  .pd-head span:first-child, .pd-head span:last-child { padding-left: 0; text-align: center; }
  .pd-head small { font-weight: 400; font-size: 1.1cqw; color: var(--s-faint); margin-left: .6cqw; letter-spacing: 0; }
  .pd-body { flex: 1 1 0; }
  .pd-row { flex: 1 1 0; min-height: 0; grid-template-rows: 1fr 1fr; border-bottom: var(--hair) solid var(--s-line); }
  .pd-row:last-child { border-bottom: 0; }
  .pd-row b { grid-row: span 2; display: flex; align-items: center; justify-content: center; font-weight: 400; font-size: 1.35cqw; color: var(--s-faint); border-right: var(--hair) solid var(--s-line); }
  .pd-row i { border-right: var(--hair) solid var(--s-line); }
  .pd-row i.h2 { border-top: var(--hair) dashed var(--s-line); }
  .pd-row i.c { grid-row: span 2; border-right: 0; display: flex; align-items: center; justify-content: center; }
  .pd-row .cb { margin: 0; width: 1.6cqw; height: 1.6cqw; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { h } = Bujo;

const classic = `
<div class="pg">
  <div class="cols" style="grid-template-columns:45fr 55fr;flex:1">
    <div class="fx">
      <div class="bar">DAILY TIME BOX PLANNER</div>
      <div class="ttl" style="margin-top:4.6cqw">TO DO LIST</div>
      <div class="box" style="flex:6">${h.checks(6)}</div>
      <div class="ttl" style="margin-top:4.6cqw">BRAIN DUMP</div>
      <div class="box" style="flex:15">${h.lines(15)}</div>
    </div>
    <div class="fx">
      ${h.dateBox()}
      <div class="ttl" style="margin-top:3.4cqw;margin-bottom:.2cqw">TIME PLAN</div>
      ${h.timeGrid({ from: 4, to: 24, sub: 6 })}
    </div>
  </div>
</div>`;

/* 01-A 클래식A — 01 클래식에서 바꾼 점
 * 1. To Do 10줄  2. 토요일 S 파란색  3. 전날 21시 ~ 다음날 5시
 * 4. 분 표기(10 20 30 …) 제거  5. 10·20·40·50분 세로줄 점선 (30분은 실선)
 */
const nightRows = [
  ...[21, 22, 23].map((hr, k) => ({ label: `<small>D-</small>${hr}`, cls: "off" + (k === 2 ? " day-end" : "") })),
  ...Array.from({ length: 24 }, (_, hr) => ({ label: hr, cls: hr === 23 ? "day-end" : "" })),
  ...[0, 1, 2, 3, 4].map(hr => ({ label: `<small>D+</small>${hr}`, cls: "off" }))
];

const classicA = `
<div class="pg sat-blue">
  <div class="cols" style="grid-template-columns:45fr 55fr;flex:1">
    <div class="fx">
      <div class="bar">DAILY TIME BOX PLANNER</div>
      <div class="ttl" style="margin-top:4.6cqw">TO DO LIST</div>
      <div class="box" style="flex:10">${h.checks(10)}</div>
      <div class="ttl" style="margin-top:4.6cqw">BRAIN DUMP</div>
      <div class="box" style="flex:15">${h.lines(15)}</div>
    </div>
    <div class="fx">
      ${h.dateBox()}
      <div class="ttl" style="margin-top:3.4cqw">TIME PLAN</div>
      ${h.timeGrid({ sub: 6, head: false, rows: nightRows })}
    </div>
  </div>
</div>`;

const focus = `
<div class="pg">
  <div class="head"><div class="bar">FOCUS TIME BOX</div>${h.dateLine()}</div>
  <div>
    <div class="ttl">TOP 3 <small>오늘 꼭 끝낼 세 가지</small></div>
    <div class="top3">${h.rep(3, i => `<div><b>${i + 1}</b></div>`)}</div>
  </div>
  <div class="cols" style="grid-template-columns:57fr 43fr;flex:1">
    <div class="fx">
      <div class="ttl">TIME BLOCK <small>30분 단위</small></div>
      ${h.timeGrid({ from: 6, to: 24, sub: 2, head: false })}
    </div>
    <div class="fx">
      <div class="ttl">TO DO</div>
      <div class="box" style="flex:10">${h.checks(10)}</div>
      <div class="ttl mt">NOTES</div>
      <div class="box dots" style="flex:8"></div>
    </div>
  </div>
</div>`;

const planDo = `
<div class="pg">
  <div class="head"><div class="bar">PLAN &amp; DO</div>${h.dateLine()}</div>
  <div class="cols" style="grid-template-columns:1fr 1fr">
    <div class="fx"><div class="ttl">GOAL <small>오늘의 목표</small></div><div class="box" style="height:10cqw">${h.lines(2)}</div></div>
    <div class="fx"><div class="ttl">PRIORITY <small>우선순위</small></div><div class="box" style="height:10cqw">${h.checks(3)}</div></div>
  </div>
  <div class="fx" style="flex:1">
    <div class="pd pd-head"><span>TIME</span><span>PLAN<small>계획</small></span><span>DO<small>실제</small></span><span>DONE</span></div>
    <div class="box pd-body">${h.rep(20, k =>
      `<div class="pd pd-row"><b>${5 + k}</b><i></i><i></i><i class="c"><u class="cb"></u></i><i class="h2"></i><i class="h2"></i></div>`)}</div>
  </div>
  <div class="fx"><div class="ttl">REVIEW <small>계획과 실제가 달랐던 이유</small></div><div class="box" style="height:9cqw">${h.lines(3)}</div></div>
</div>`;

Bujo.mount({
  section: "daily",
  id: "daily-timebox",
  name: "타임박스 플래너",
  en: "Time Box Planner",
  summary: "할 일을 시간 블록에 직접 배치하는 데일리 플래너입니다. 무엇을 할지뿐 아니라 언제 할지까지 정해 하루를 설계합니다.",
  parts: [
    "날짜 · 요일 칸",
    "To Do 체크리스트",
    "브레인 덤프 (떠오르는 생각 비우기)",
    "시간 그리드 (10분 또는 30분 단위)",
    "디자인에 따라 Top 3, 계획 · 실제 비교 칸"
  ],
  usage: [
    "아침에 떠오르는 일을 브레인 덤프나 노트 칸에 모두 적습니다.",
    "그중 오늘 할 일 3~6개를 To Do로 옮깁니다.",
    "할 일마다 시간 그리드에 블록을 칠하거나 화살표로 배치합니다.",
    "하루를 보내며 실제로 한 일을 다른 색으로 겹쳐 칠해 계획과 비교합니다."
  ],
  tips: [
    "할 일마다 예상 시간보다 20% 정도 여유를 두세요.",
    "노트 앱의 형광펜으로 블록을 칠하면 지우고 다시 배치하기 쉽습니다.",
    "시간 범위는 디자인마다 다릅니다. 클래식 4~24시, 클래식A 전날 21시 ~ 다음날 5시, 포커스 6~24시, 계획 · 실행 5~24시.",
    "클래식A의 D-는 전날, D+는 다음날 시각입니다. 늦게 자거나 밤에 일하는 날에 맞습니다."
  ],
  variants: [
    { key: "classic", name: "클래식", desc: "레퍼런스 양식. 할 일과 브레인 덤프, 10분 단위 타임 플랜(4~24시).", html: classic },
    { key: "classic-a", no: "01-A", name: "클래식A", desc: "클래식 기반. 할 일 10줄, 전날 21시 ~ 다음날 5시 타임 플랜, 분 표기 없음, 토요일 파란색.", html: classicA },
    { key: "focus",   name: "포커스", desc: "Top 3를 맨 위에 두고, 30분 단위 시간 블록과 할 일·노트를 나란히 배치.", html: focus },
    { key: "plan-do", name: "계획 · 실행", desc: "시간마다 계획과 실제를 나란히 적고, 마지막에 차이를 돌아봅니다.", html: planDo }
  ]
});
</script>
</body>
</html>
